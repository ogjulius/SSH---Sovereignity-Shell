# Source validation, unit tests, QML lint and live runtime tests on real
# (nested, headless) Hyprland and Niri sessions. Runs in Arch Linux containers
# because Arch ships Quickshell, Hyprland and Niri in its official repos.
name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }

jobs:
  test:
    name: Unit tests · qmllint · load test (Arch Linux)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed git make python quickshell qt6-declarative qt6-svg \
            inter-font ttf-jetbrains-mono dbus fish zsh dash desktop-file-utils
      - uses: actions/checkout@v4
      - name: Source validation
        run: |
          for f in scripts/*.sh scripts/ci/*.sh installer/ssh-install.sh installer/lib/*.sh installer/backends/*.sh \
                   data/completions/ssh-shell.bash; do bash -n "$f" && echo "ok  $f"; done
          # POSIX sh entry points must not depend on bash.
          for f in install.sh bin/ssh-shell bin/ssh-session; do dash -n "$f" && echo "ok  $f (dash)"; done
          fish -n data/completions/ssh-shell.fish && echo "ok  fish completion"
          zsh -n data/completions/_ssh-shell && echo "ok  zsh completion"
          for f in src/themes/presets/*.json; do python -m json.tool "$f" >/dev/null && echo "ok  $f"; done
          python scripts/check-links.py
      - name: Unit tests, Qt 6 qmllint, offscreen load test
        env: { QT_QPA_PLATFORM: offscreen }
        run: dbus-run-session -- ./scripts/test.sh
      - name: Installation layout
        run: ./scripts/check-layout.sh /usr

  runtime:
    name: Runtime on ${{ matrix.compositor }} (nested, headless)
    runs-on: ubuntu-latest
    container: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        # Hyprland is not in the matrix: even nested, its Aquamarine backend
        # needs a DRM render node (GBM), which GitHub-hosted runners lack
        # ("CBackend::create() failed!"). Hyprland is verified on real hardware;
        # see docs/installation/COMPATIBILITY.md.
        compositor: [niri]
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed git make python sudo quickshell qt6-declarative qt6-svg \
            inter-font ttf-jetbrains-mono dbus sway grim foot libnotify mesa libcap \
            ${{ matrix.compositor }}
          useradd -m tester
          # Unprivileged containers refuse to exec binaries with file
          # capabilities (Arch ships sway with cap_sys_nice); strip them here.
          for b in /usr/bin/sway /usr/bin/Hyprland /usr/bin/niri; do
            [ -e "$b" ] && setcap -r "$b" 2>/dev/null || true
          done
      - uses: actions/checkout@v4
      - name: Run SSH inside nested ${{ matrix.compositor }}
        run: |
          chown -R tester: .
          sudo -u tester env -i HOME=/home/tester PATH=/usr/bin:/bin \
            ./scripts/ci/runtime-test.sh ${{ matrix.compositor }} runtime-${{ matrix.compositor }}
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.compositor }}
          path: runtime-${{ matrix.compositor }}/
          if-no-files-found: warn
